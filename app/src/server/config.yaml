system:
  env: 'local'
  addr: 26655

cors:
  whitelist:
    # Keep the inherited origin policy; allow cursor-based SSE for this frontend.
    - allow-origin: '${IM_WEB_FRONTEND_URL}'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token,x-request-id,X-Request-ID,x-session-id,X-Session-ID,Last-Event-ID'
      allow-methods: 'POST, GET, OPTIONS, PUT, DELETE, UPDATE'
      expose-headers: 'Content-Length, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Content-Type, New-Token, New-Expires-At'
      allow-credentials: true

# 认证配置：im 是资源服务，只保留共享 JWT 校验中间件，不提供登录端点。
auth:
  provider: 'builtin'
  serve-routes: false

# 权限控制：auth 是唯一 RBAC 控制面；im 只读消费共享库中的即时授权结果。
rbac:
  provider: 'external'

jwt:
  signing-key: '${JWT_SECRET}'
  expires-time: '15m'
  refresh-expires-time: '168h'
  refresh-family-expires-time: '720h'
  refresh-rotation-grace: '60s'
  buffer-time: '5m'
  issuer: 'nucleagent-auth'

mysql:
  host: '${DB_HOST}'
  port: '${DB_PORT}'
  db-name: '${DB_NAME}'
  username: '${DB_USER}'
  password: '${DB_PASSWORD}'
  config: 'charset=utf8mb4&parseTime=True&loc=Local'
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: 'error'
  log-zap: false

zap:
  level: 'info'
  prefix: '[NUCLEAGENT-IM]'
  format: 'console'
  director: 'log'
  encode-level: 'LowercaseColorLevelEncoder'
  stacktrace-key: 'stacktrace'
  max-age: 0
  show-line: true
  log-in-console: true

wukongim:
  # Deploy with the in-cluster WuKongIM Service DNS; localhost is for local development.
  api-addr: '${WUKONGIM_API_ADDR:-http://127.0.0.1:26651}'
  manager-addr: '${WUKONGIM_MANAGER_ADDR:-http://127.0.0.1:26654}'
  ws-addr: '${WUKONGIM_WS_ADDR:-ws://127.0.0.1:26652}'

im:
  connect-token-secret: '${IM_CONNECT_TOKEN_SECRET}'
  # Generate with: openssl rand -hex 32
  webhook-capability: '${IM_WEBHOOK_CAPABILITY}'
  core-url: '${CORE_URL:-http://127.0.0.1:26653}'
  service-jwt: '${IM_SERVICE_JWT}'
  wukong-admin-user: '${IM_WUKONG_ADMIN_USER}'
  wukong-admin-pass: '${IM_WUKONG_ADMIN_PASS}'
